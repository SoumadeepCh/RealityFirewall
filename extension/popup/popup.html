<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reality Firewall</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      min-height: 200px;
      background: #050510;
      color: #f0f0f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      overflow: hidden;
    }

    /* Header */
    .header {
      padding: 14px 16px 12px;
      background: linear-gradient(135deg, rgba(6,214,160,0.12), rgba(123,97,255,0.08));
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #06d6a0, #7b61ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .header-subtitle {
      font-size: 10px;
      color: #55556a;
      margin-top: 1px;
    }

    /* Status dot */
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #06d6a0;
      margin-left: auto;
      flex-shrink: 0;
      animation: pulse 2s ease-in-out infinite;
    }

    .status-dot.offline { background: #ff4d6d; animation: none; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* Sections */
    .section { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .section:last-child { border-bottom: none; }

    .section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #55556a;
      font-weight: 700;
      margin-bottom: 8px;
    }

    /* Toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-label { font-size: 13px; color: #c0c0d0; }
    .toggle-desc { font-size: 10px; color: #55556a; margin-top: 2px; }

    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .toggle-track {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 10px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle input:checked + .toggle-track {
      background: #06d6a0;
      border-color: #06d6a0;
    }

    .toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s;
    }

    .toggle input:checked ~ .toggle-thumb { transform: translateX(16px); }

    /* Service URL input */
    .input-group { margin-top: 4px; }
    .input-label { font-size: 11px; color: #55556a; margin-bottom: 4px; }

    .input {
      width: 100%;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      color: #f0f0f5;
      font-size: 12px;
      font-family: monospace;
      outline: none;
      transition: border-color 0.2s;
    }

    .input:focus { border-color: rgba(6,214,160,0.5); }

    /* Save button */
    .btn {
      width: 100%;
      padding: 9px 16px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #06d6a0, #7b61ff);
      color: #050510;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      margin-top: 8px;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.9; }
    .btn:active { opacity: 0.75; }

    .btn-secondary {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: #8888a0;
    }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat-box {
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .stat-value {
      font-size: 18px;
      font-weight: 800;
      font-family: monospace;
      color: #06d6a0;
    }

    .stat-label {
      font-size: 10px;
      color: #55556a;
      margin-top: 2px;
    }

    /* Footer */
    .footer {
      padding: 8px 16px;
      font-size: 10px;
      color: #35354a;
      text-align: center;
    }

    #save-status {
      font-size: 11px;
      color: #06d6a0;
      text-align: center;
      height: 16px;
      margin-top: 4px;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-logo">🛡</div>
    <div>
      <div class="header-title">Reality Firewall</div>
      <div class="header-subtitle">AI Media Authenticity</div>
    </div>
    <div class="status-dot" id="status-dot"></div>
  </div>

  <!-- Service Stats -->
  <div class="section">
    <div class="section-label">Service Statistics</div>
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-value" id="stat-total">—</div>
        <div class="stat-label">Total Analyses</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="stat-threats" style="color:#ff4d6d">—</div>
        <div class="stat-label">Threats Found</div>
      </div>
    </div>
  </div>

  <!-- Settings -->
  <div class="section">
    <div class="section-label">Settings</div>

    <div class="toggle-row" style="margin-bottom:12px">
      <div>
        <div class="toggle-label">Auto-scan images</div>
        <div class="toggle-desc">Analyze large images automatically (max 5/page)</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="auto-scan" />
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
    </div>

    <div class="input-group">
      <div class="input-label">AI Service URL</div>
      <input
        type="text"
        class="input"
        id="service-url"
        placeholder="http://localhost:8000"
        spellcheck="false"
      />
    </div>

    <button class="btn" id="save-btn">Save Settings</button>
    <div id="save-status"></div>
  </div>

  <!-- Actions -->
  <div class="section">
    <div class="section-label">Actions</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-secondary" id="open-dashboard" style="flex:1">
        Open Dashboard
      </button>
      <button class="btn btn-secondary" id="retrain-btn" style="flex:1">
        Retrain Model
      </button>
    </div>
  </div>

  <div class="footer">Reality Firewall v1.0 · right-click images to analyze</div>

  <script src="popup.js"></script>
</body>
</html>
